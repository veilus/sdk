langchain = ["langchain-community", "playwright", "beautifulsoup4", "lxml"]
selenium = ["selenium"]
scrapling = ["scrapling[fetchers]"]
crawlee = ["crawlee[playwright]"]
browser-use = ["browser-use"]

[tool.uv]
package = false
