name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# This repository is public and accepts pull requests from forks, so jobs run
# arbitrary code. They must stay on GitHub-hosted runners — never a
# self-hosted one.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    js:
        name: js (node ${{ matrix.node }})
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            matrix:
                node: ["18", "22"]
        defaults:
            run:
                working-directory: js
        steps:
            # Actions are pinned by SHA (tags can move); the tag is in the comment.
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node }}
            - run: npm test
            - run: npm pack --dry-run

    python:
        name: python ${{ matrix.python }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            matrix:
                python: ["3.10", "3.13"]
        defaults:
            run:
                working-directory: python
        env:
            UV_PYTHON: ${{ matrix.python }}
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
            - run: uvx ruff@0.16.6 check .
            - run: uvx ruff@0.16.6 format --check .
            - run: uv run --group dev pytest -q
            - run: uv build
